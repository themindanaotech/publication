<style>

.cm-me{display:flex;gap:12px}.cm-f{flex:1;min-width:0}

.cm-row .pri{background:var(--hi);color:#111;border:0;padding:9px 18px;font:700 12px var(--mo);letter-spacing:.08em;text-transform:uppercase}.cm-row .pri:disabled{opacity:.5}
.cm-row .gh,.cm-x{background:none;border:0;color:var(--mute);font:600 12px var(--mo);padding:6px}.cm-row .gh:hover,.cm-x:hover{color:var(--hi)}

.cm{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.cm .av{width:36px;height:36px;font-size:14px;flex:none;overflow:hidden}.av{position:relative}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

</style></head><body>
<div id="splash" role="button" tabindex="0" aria-label="Tap anywhere to continue"><div class="in"><img id="sLogo" alt="The Mindanao Tech logo"><h1>THE <em>MINDANAO</em> TECH</h1><div class="rule"></div><p id="sMotto"></p><div class="bar"><i></i></div><div class="tap" id="sTap">Tap anywhere to continue</div></div></div>
<header><div class="wrap"><div class="top">
<a class="brand" href="#home" aria-label="The Mindanao Tech home"><span id="hLogo"></span><span>THE <em>MINDANAO</em> TECH</span></a>
<button id="burger" aria-label="Menu" aria-expanded="false">&#9776;</button>
<nav id="nav"></nav>
<form class="srch" id="sf" role="search"><input type="search" placeholder="Search stories" aria-label="Search"><button aria-label="Search">&#9906;</button></form></div></div></header>
<div id="tick"><div class="wrap"><b>LATEST</b><span id="tk"></span></div></div>
<main class="wrap" id="view"></main>
<footer><div class="wrap"><div><a class="brand" href="#home"><span id="fLogo"></span><span>THE MINDANAO TECH</span></a><p style="margin-top:12px;max-width:380px" id="fAbout"></p></div>
<div><h4>Sections</h4><div id="fCats"></div></div><div><h4>Follow</h4><a id="fb" target="_blank" rel="noopener">Facebook</a><a href="#home">Subscribe</a><a href="privacy.html">Privacy Policy</a></div>
<div class="cp"><span id="fName"></span><span id="fDev"></span></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="theme.js"></script>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF={name:"The Mindanao Tech",motto:"Informing the campus, one story at a time.",logo:"",facebook:"https://www.facebook.com/",splash:"always",perPage:6,footer:"",categories:"News,Explainers,Opinion,Life,Sorted,Multimedia"};
const ok=CFG.SUPABASE_URL&&!CFG.SUPABASE_URL.includes("YOUR");
const QS=new URLSearchParams(location.search),OAUTH=QS.has("code"),OERR=QS.get("error_description")||"";
const db=ok?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{flowType:"pkce",detectSessionInUrl:true,persistSession:true}}):null;
let S={...DEF},POSTS=[],CATS=[],page=1,LOGO="logo.png";
// Extra photos are saved at the end of the body as a [[photos]] block (no database change needed).
const PH=/\n*\[\[photos\]\]([\s\S]*?)\[\[\/photos\]\]\s*$/,
  txt=a=>(a.body||"").replace(PH,""),pics=a=>{const m=(a.body||"").match(PH);return m?m[1].split("\n").map(x=>x.trim()).filter(Boolean):[]};
const mins=a=>Math.max(1,Math.round(txt(a).split(/\s+/).length/200));
const fmt=d=>new Date(d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
const bg=a=>a.image?`background-image:url('${esc(a.image)}')`:`background-image:linear-gradient(135deg,var(--slate),var(--main))`;
const meta=a=>`<div class="meta"><span>By ${esc(a.author||"Staff")}</span><span>${fmt(a.created_at)}</span><span>${mins(a)} min read</span></div>`;
const card=a=>`<a class="card" href="#p-${a.id}"><div class="thumb"><i style="${bg(a)}"></i></div><span class="tag" style="display:block;margin-top:12px">${esc(a.category)}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt)}</p>${meta(a)}</a>`;
const logoImg=()=>`<img class="logo" src="${esc(LOGO)}" alt="The Mindanao Tech logo" onerror="this.outerHTML='<span class=mono>MT</span>'">`;
const byCat=c=>POSTS.filter(a=>(a.category||"").toLowerCase()===c);
const block=(t,c,n,fn)=>{const l=byCat(c).slice(0,n);return l.length?`<h2 class="sec"><span>${t}</span><a href="#${c}">View all &rarr;</a></h2>${fn(l)}`:""};
const TEAM=()=>(Array.isArray(S.team)?S.team:[]).map(g=>({...g,members:(g.members||[]).filter(m=>m&&m.name)})).filter(g=>g.members.length);
const mCard=m=>`<div class="tc" id="tm-${esc(m.id||"")}"><div class="tp">${esc((m.name||"?").trim().charAt(0).toUpperCase())}${m.photo?`<i style="background-image:url('${esc(m.photo)}')"></i>`:""}</div><b>${esc(m.name)}</b>${m.role?`<span>${esc(m.role)}</span>`:""}</div>`;
let LK=h=>h;
// Turns every team member's full name found in a story into a highlighted link to their spot on the Our Team page.
function nameLinker(){try{const ms=TEAM().flatMap(g=>g.members).filter(m=>m.id&&m.name.trim().length>1);if(!ms.length)return h=>h;
  const map={};ms.forEach(m=>{map[esc(m.name.trim()).toLowerCase()]=m.id});
  const keys=Object.keys(map).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re=new RegExp("(?<![\\p{L}\\p{N}&#])("+keys.join("|")+")(?![\\p{L}\\p{N}])","giu");
  return h=>h.replace(re,t=>{const id=map[t.toLowerCase()];return id?`<a class="mn" href="#team-${id}">${t}</a>`:t})}catch(e){return h=>h}}
function pager(n){const p=Math.ceil(n/S.perPage);if(p<2)return"";let h=`<div class="pager"><button data-p="${page-1}" ${page==1?"disabled":""}>&lsaquo;</button>`;for(let i=1;i<=p;i++)h+=`<button data-p="${i}" class="${i==page?"on":""}">${i}</button>`;return h+`<button data-p="${page+1}" ${page==p?"disabled":""}>&rsaquo;</button></div>`}
const subscribe=`<section class="sub"><div><h2>Get new stories in your inbox</h2><p>Join the list and we'll email you when we publish.</p></div><form id="subForm"><input type="email" required placeholder="you@email.com" aria-label="Email address"><button>Subscribe</button></form><div id="ok" role="status"></div></section>`;
function render(){
  const h=decodeURIComponent(location.hash.slice(1))||"home",v=$("#view");

const avatar=(url,name)=>`<span class="av">${esc((name||"?").trim().charAt(0).toUpperCase())}${url?`<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span>`;

function setUser(s){const u=s&&s.user||null;let noted=false;

const AUTH=db?db.auth.getSession().then(r=>{setUser(r.data.session);LAST=USER?USER.id:null;
  if(OAUTH||OERR){if(OERR&&!USER&&!NOTE)NOTE="Sign-in didn't finish. Please try again.";try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}

    if(b&&b!==location.hash){GO=true;location.hash=b}}}).catch(()=>{}):Promise.resolve();
if(db)db.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{const noted=setUser(s),id=USER?USER.id:null;if(id===LAST&&!noted)return;LAST=id;

function drawShell(){const e=$("#eng");if(!e)return;

function drawBox(){const b=$("#cmBox");if(!b)return;const keep=$("#cmT")?$("#cmT").value:"";

function drawList(){const l=$("#cmList"),h=$("#cmH");if(!l)return;const c=ENG.comments;

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mindanao Tech</title><link id="ico" rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--main:#080e19;--slate:#172235;--hi:#f4b344;--text:#f5f1e8;--acc:#f4b344;--mute:#a9b0be;--line:#ffffff1f;--bgimg:none;--pf:'Playfair Display',Georgia,serif;--mw:'Merriweather',Georgia,serif;--mo:'Montserrat',system-ui,sans-serif;--in:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:16px/1.65 var(--in);background:var(--main) var(--bgimg) center/cover fixed;color:var(--text);transition:background-color .5s}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;overflow:hidden;background:radial-gradient(70vmax 70vmax at 50% 38%,color-mix(in srgb,var(--hi) 22%,var(--main)),var(--main) 62%);text-align:center;transition:opacity .8s,visibility .8s,transform .8s}#splash.out{opacity:0;visibility:hidden;transform:scale(1.06)}
#splash:before,#splash:after{content:"";position:absolute;left:50%;top:38%;border:1px solid var(--hi);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:ring 3.2s ease-out infinite}#splash:after{animation-delay:1.1s}
#splash .in{position:relative;z-index:1;max-width:1100px}
#splash img{height:clamp(130px,26vmin,240px);width:auto;max-width:80vw;object-fit:contain;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--hi) 55%,transparent));animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 4s 1s ease-in-out infinite}
#splash h1{font:900 clamp(28px,7vw,68px)/1.05 var(--pf);letter-spacing:.06em;margin:clamp(18px,4vh,34px) 0 0;text-transform:uppercase;animation:up .9s .45s both}#splash h1 em{font-style:normal;color:var(--hi)}
#splash .rule{width:0;height:3px;background:var(--hi);margin:clamp(14px,3vh,26px) auto;animation:grow 1s .9s forwards}
#splash p{font:italic 400 clamp(16px,3.2vw,28px)/1.5 var(--mw);color:var(--text);opacity:.88;max-width:640px;margin:0 auto;animation:up .9s 1.2s both}
.bar{width:min(260px,60vw);height:4px;background:var(--line);margin:clamp(24px,5vh,44px) auto 0;overflow:hidden;border-radius:4px}.bar i{display:block;height:100%;background:var(--hi);animation:load 3.2s ease-in-out both}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}@keyframes load{from{width:0}to{width:100%}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}@keyframes grow{to{width:min(180px,40vw)}}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes ring{0%{width:120px;height:120px;opacity:.7}100%{width:130vmax;height:130vmax;opacity:0}}
.logo{height:46px;width:auto;object-fit:contain;display:block}.mono{display:grid;place-items:center;width:46px;height:46px;border:2px solid var(--hi);color:var(--hi);font:800 18px var(--pf)}
#seasonal{display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 12px;background:var(--acc) center/cover;color:#111;font:700 12px var(--mo);letter-spacing:.06em;text-transform:uppercase;text-align:center}#seasonal img{height:22px;width:auto}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--main) 94%,transparent);backdrop-filter:blur(10px);border-bottom:3px solid var(--hi)}
.top{display:flex;align-items:center;gap:16px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;flex:none}.brand span{font:900 clamp(15px,4.4vw,22px)/1.1 var(--pf);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.brand em{font-style:normal;color:var(--hi)}
nav{display:flex;gap:0;margin-left:auto;min-width:0;flex-wrap:nowrap}nav a{font:600 11px var(--mo);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:10px 8px;color:var(--mute);border-bottom:2px solid transparent;transition:.2s}
nav a:hover{color:var(--text)}nav a.on{color:var(--hi);border-color:var(--hi)}
.srch{display:flex}.srch{flex:none}.srch input{width:110px;padding:8px 12px;background:var(--slate);border:1px solid var(--line);border-right:0;color:var(--text);font:inherit;font-size:14px}.srch button{background:var(--hi);color:#111;border:0;padding:0 12px;font-weight:700}
#burger{display:none;background:none;border:1px solid var(--line);color:var(--text);padding:8px 12px;margin-left:auto}
#tick{background:var(--slate);border-bottom:1px solid var(--line);font:500 13px var(--in);overflow:hidden;white-space:nowrap}#tick .wrap{display:flex;gap:18px;align-items:center;padding:8px 20px;overflow-x:auto}
#tick b{font:800 11px var(--mo);letter-spacing:.1em;background:var(--hi);color:#111;padding:3px 9px;flex:none}#tick a{flex:none;color:var(--mute)}#tick a:hover{color:var(--hi)}
main{min-height:70vh;padding:32px 0 56px;animation:fade .5s both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.sec{font:800 13px var(--mo);letter-spacing:.14em;text-transform:uppercase;margin:46px 0 20px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--hi)}h2.sec a{color:var(--mute);font-size:11px}
.tag{font:700 11px var(--mo);letter-spacing:.12em;text-transform:uppercase;color:var(--hi)}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--mute)}
.thumb{aspect-ratio:16/10;overflow:hidden;background:var(--slate);position:relative}.thumb i{position:absolute;inset:0;background:center/cover;transition:transform .6s}
.card:hover .thumb i,.hero:hover .thumb i{transform:scale(1.05)}
.card h3{font:700 19px/1.35 var(--mw);margin:10px 0 6px;transition:color .2s}.card:hover h3,.hero:hover h1{color:var(--hi)}.card p{color:var(--mute);font-size:14.5px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 24px}
.feat{display:grid;grid-template-columns:1.7fr 1fr;gap:32px}.hero .thumb{aspect-ratio:16/9}
.hero h1{font:900 clamp(28px,4.2vw,44px)/1.12 var(--pf);margin:14px 0 10px;transition:color .2s}.hero p{color:var(--mute);font-size:17px;margin-bottom:10px}
.side{display:grid;gap:22px;align-content:start}.side .card{border-bottom:1px solid var(--line);padding-bottom:20px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gal .thumb{aspect-ratio:1}
.pager{display:flex;justify-content:center;gap:8px;margin-top:44px}.pager button{min-width:40px;height:40px;border:1px solid var(--line);background:none;color:var(--text)}.pager .on{background:var(--hi);color:#111;border-color:var(--hi)}.pager button:disabled{opacity:.4}
.sub{margin-top:64px;background:var(--slate);border-top:3px solid var(--hi);padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.sub h2{font:800 26px var(--pf)}.sub p{color:var(--mute)}.sub form{display:flex;gap:8px}.sub input{flex:1;min-width:0;padding:12px 14px;border:0;font:inherit;background:var(--text);color:#111}
.sub button{padding:12px 20px;border:0;background:var(--hi);color:#111;font:700 13px var(--mo);text-transform:uppercase;letter-spacing:.08em}#ok{grid-column:1/-1;color:var(--hi);min-height:1.4em}
.art{max-width:720px;margin:0 auto}.art h1{font:900 clamp(30px,5vw,46px)/1.15 var(--pf);margin:12px 0 14px}.art .thumb{margin:24px 0;aspect-ratio:16/9}
.art .body p{font:18px/1.85 var(--mw);margin-bottom:22px}.by{display:flex;align-items:center;gap:12px;margin:6px 0}.by b{font:700 14px var(--mo)}
.av{width:42px;height:42px;border-radius:50%;background:var(--hi);color:#111;display:grid;place-items:center;font:800 15px var(--mo)}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:18px 0;font:600 12px var(--mo)}
.share a,.share button{border:1px solid var(--line);background:none;color:var(--text);padding:6px 14px;font:600 12px var(--mo);letter-spacing:.06em}.share a:hover,.share button:hover{border-color:var(--hi);color:var(--hi)}
.back{color:var(--hi);font:600 12px var(--mo);letter-spacing:.08em;text-transform:uppercase}
footer{background:var(--slate);border-top:3px solid var(--hi);padding:36px 0 22px;font-size:14px;color:var(--mute)}footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
footer .brand span{color:var(--text);font-size:20px}footer h4{font:700 12px var(--mo);letter-spacing:.12em;text-transform:uppercase;color:var(--hi);margin-bottom:10px}footer a{display:block;padding:2px 0}footer a:hover{color:var(--hi)}footer .cp{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px}
.mt-deco{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.mt-deco span{position:absolute;top:-30px;opacity:.35;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(200deg)}}
.lights{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around}.lights i{width:9px;height:9px;border-radius:50%;background:var(--hi);animation:tw 2s infinite;box-shadow:0 0 10px var(--hi)}.lights i:nth-child(3n){background:var(--acc);animation-delay:.6s}.lights i:nth-child(3n+1){background:#3ba55c;animation-delay:1.2s}@keyframes tw{50%{opacity:.25}}
@media(max-width:1280px){#burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--main);flex-direction:column;padding:8px 20px 16px;border-bottom:3px solid var(--hi)}nav.open{display:flex}.srch{display:none}nav .srch{display:flex}header .wrap{position:relative}}@media(max-width:900px){.feat,.sub,footer .wrap{grid-template-columns:1fr}.gal{grid-template-columns:repeat(2,1fr)}.sub form{flex-direction:column}}
@media(max-width:1280px){nav .srch input{width:100%;flex:1}}@media(min-width:1281px){nav .srch{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style></head><body>
<div id="splash"><div class="in"><img id="sLogo" alt="The Mindanao Tech logo"><h1>THE <em>MINDANAO</em> TECH</h1><div class="rule"></div><p id="sMotto"></p><div class="bar"><i></i></div></div></div>
<header><div class="wrap"><div class="top">
<a class="brand" href="#home" aria-label="The Mindanao Tech home"><span id="hLogo"></span><span>THE <em>MINDANAO</em> TECH</span></a>
<button id="burger" aria-label="Menu" aria-expanded="false">&#9776;</button>
<nav id="nav"></nav>
<form class="srch" id="sf" role="search"><input type="search" placeholder="Search stories" aria-label="Search"><button aria-label="Search">&#9906;</button></form></div></div></header>
<div id="tick"><div class="wrap"><b>LATEST</b><span id="tk"></span></div></div>
<main class="wrap" id="view"></main>
<footer><div class="wrap"><div><a class="brand" href="#home"><span id="fLogo"></span><span>THE MINDANAO TECH</span></a><p style="margin-top:12px;max-width:380px" id="fAbout"></p></div>
<div><h4>Sections</h4><div id="fCats"></div></div><div><h4>Follow</h4><a id="fb" target="_blank" rel="noopener">Facebook</a><a href="#home">Subscribe</a></div>
<div class="cp" id="fName"></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="theme.js"></script>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF={name:"The Mindanao Tech",motto:"Informing the campus, one story at a time.",logo:"",facebook:"https://www.facebook.com/",splash:"always",perPage:6,footer:"",categories:"News,Explainers,Opinion,Life,Sorted,Multimedia"};
const ok=CFG.SUPABASE_URL&&!CFG.SUPABASE_URL.includes("YOUR");
const db=ok?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY):null;
let S={...DEF},POSTS=[],CATS=[],page=1,LOGO="logo.png";
const mins=a=>Math.max(1,Math.round((a.body||"").split(/\s+/).length/200));
const fmt=d=>new Date(d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
const bg=a=>a.image?`background-image:url('${esc(a.image)}')`:`background-image:linear-gradient(135deg,var(--slate),var(--main))`;
const meta=a=>`<div class="meta"><span>By ${esc(a.author||"Staff")}</span><span>${fmt(a.created_at)}</span><span>${mins(a)} min read</span></div>`;
const card=a=>`<a class="card" href="#p-${a.id}"><div class="thumb"><i style="${bg(a)}"></i></div><span class="tag" style="display:block;margin-top:12px">${esc(a.category)}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt)}</p>${meta(a)}</a>`;
const logoImg=()=>`<img class="logo" src="${esc(LOGO)}" alt="The Mindanao Tech logo" onerror="this.outerHTML='<span class=mono>MT</span>'">`;
const byCat=c=>POSTS.filter(a=>(a.category||"").toLowerCase()===c);
const block=(t,c,n,fn)=>{const l=byCat(c).slice(0,n);return l.length?`<h2 class="sec"><span>${t}</span><a href="#${c}">View all &rarr;</a></h2>${fn(l)}`:""};
function pager(n){const p=Math.ceil(n/S.perPage);if(p<2)return"";let h=`<div class="pager"><button data-p="${page-1}" ${page==1?"disabled":""}>&lsaquo;</button>`;for(let i=1;i<=p;i++)h+=`<button data-p="${i}" class="${i==page?"on":""}">${i}</button>`;return h+`<button data-p="${page+1}" ${page==p?"disabled":""}>&rsaquo;</button></div>`}
const subscribe=`<section class="sub"><div><h2>Get new stories in your inbox</h2><p>Join the list and we'll email you when we publish.</p></div><form id="subForm"><input type="email" required placeholder="you@email.com" aria-label="Email address"><button>Subscribe</button></form><div id="ok" role="status"></div></section>`;
function render(){
  const h=decodeURIComponent(location.hash.slice(1))||"home",v=$("#view");
  const art=h.startsWith("p-")&&POSTS.find(a=>a.id===h.slice(2)),cat=CATS.find(c=>c.toLowerCase()===h.toLowerCase()),s=(page-1)*S.perPage;let html="";
  document.querySelectorAll("#nav>a").forEach(a=>a.classList.toggle("on",a.dataset.k===(art?art.category:cat||(h=="home"?"home":""))));
  if(art){const u=encodeURIComponent(location.href.split("#")[0]+"#p-"+art.id),t=encodeURIComponent(art.title),au=art.author||"Staff";
    html=`<article class="art"><a class="back" href="#${esc(art.category.toLowerCase())}">&larr; ${esc(art.category)}</a><br><span class="tag" style="display:block;margin-top:14px">${esc(art.category)}</span><h1>${esc(art.title)}</h1><p style="color:var(--mute);font-size:18px">${esc(art.excerpt)}</p>
    <div class="by" style="margin-top:16px"><span class="av">${esc(au.trim().charAt(0).toUpperCase())}</span><div><b>${esc(au)}</b>${meta(art).replace(/<span>By [^<]*<\/span>/,"")}</div></div>
    <div class="share"><span>SHARE</span><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=${u}&text=${t}">X</a><button id="cp">Copy link</button></div>
    <div class="thumb"><i style="${bg(art)}"></i></div><div class="body">${(art.body||"").split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join("")}</div></article>`;document.title=art.title+" | The Mindanao Tech"}
  else if(h.startsWith("q-")){const q=h.slice(2).toLowerCase(),l=POSTS.filter(a=>[a.title,a.excerpt,a.author,a.category,a.body].join(" ").toLowerCase().includes(q));
    html=`<h2 class="sec" style="margin-top:0"><span>Search: ${esc(q)} (${l.length})</span></h2>`+(l.length?`<div class="grid">${l.map(card).join("")}</div>`:"<p>No stories matched your search.</p>")}
  else if(cat){const l=byCat(cat.toLowerCase());html=`<h2 class="sec" style="margin-top:0"><span>${esc(cat)}</span></h2>`+(l.length?`<div class="grid">${l.slice(s,s+S.perPage).map(card).join("")}</div>${pager(l.length)}`:"<p>No stories here yet. Check back soon.</p>");document.title=cat+" | The Mindanao Tech"}
  else if(!POSTS.length){html=`<p>No stories published yet.${ok?"":" Add your Supabase details in config.js to load stories."}</p>`+subscribe}
  else{const f=POSTS.filter(a=>a.featured).slice(0,3),m=f[0]||POSTS[0],side=(f.length>1?f.slice(1):POSTS.filter(a=>a!==m).slice(0,2)),shown=[m,...side],rest=POSTS.filter(a=>!shown.includes(a));
    html=`<section class="feat"><a class="hero" href="#p-${m.id}"><div class="thumb"><i style="${bg(m)}"></i></div><span class="tag" style="display:block;margin-top:16px">${esc(m.category)}</span><h1>${esc(m.title)}</h1><p>${esc(m.excerpt)}</p>${meta(m)}</a><div class="side">${side.map(card).join("")}</div></section>
    <h2 class="sec"><span>Latest stories</span></h2><div class="grid">${rest.slice(s,s+S.perPage).map(card).join("")}</div>${pager(rest.length)}`;
    if(page==1)html+=block("Opinion &amp; Editorial","opinion",3,l=>`<div class="grid">${l.map(card).join("")}</div>`)+block("Student Life &amp; Campus","life",3,l=>`<div class="grid">${l.map(card).join("")}</div>`)+block("Technology, Science &amp; Innovation","explainers",3,l=>`<div class="grid">${l.map(card).join("")}</div>`)+block("Photojournalism","multimedia",8,l=>`<div class="gal">${l.map(a=>`<a class="card" href="#p-${a.id}" title="${esc(a.title)}"><div class="thumb"><i style="${bg(a)}"></i></div></a>`).join("")}</div>`);
    html+=subscribe;document.title="The Mindanao Tech";}
  v.style.animation="none";v.offsetHeight;v.style.animation="";v.innerHTML=html;
  v.querySelectorAll(".pager button").forEach(b=>b.onclick=()=>{page=+b.dataset.p;render();scrollTo({top:0,behavior:"smooth"})});
  const c=$("#cp");if(c)c.onclick=()=>navigator.clipboard.writeText(location.href).then(()=>c.textContent="Copied!");
  const f=$("#subForm");if(f)f.onsubmit=async e=>{e.preventDefault();const em=f.querySelector("input").value.trim();let err=!db;if(db){const r=await db.from("subscribers").insert({email:em});err=r.error&&r.error.code!=="23505"}
    $("#ok").textContent=err?"Something went wrong. Please try again.":"Thanks! You're on the list.";if(!err)f.reset()};
}
function applySettings(){
  LOGO=S.logo||"logo.png";CATS=String(S.categories).split(",").map(c=>c.trim()).filter(Boolean);S.perPage=+S.perPage||6;
  const pv=new URLSearchParams(location.search).get("preview");MT.apply(MT.resolve(S,pv||undefined),LOGO);
  $("#ico").href=LOGO;$("#sLogo").src=LOGO;$("#sLogo").onerror=e=>e.target.remove();$("#sMotto").textContent=S.motto||DEF.motto;
  $("#hLogo").innerHTML=$("#fLogo").innerHTML=logoImg();$("#fb").href=S.facebook;$("#fAbout").textContent=S.motto+" The official student publication of the University of Southern Mindanao.";
  $("#fName").textContent=S.footer||"© "+new Date().getFullYear()+" The Mindanao Tech. All rights reserved.";
  const q=$("#sf").outerHTML.replace('id="sf"','');
  $("#nav").innerHTML=`<a href="#home" data-k="home">Home</a>`+CATS.map(c=>`<a href="#${esc(c.toLowerCase())}" data-k="${esc(c)}">${esc(c)}</a>`).join("")+q;
  $("#fCats").innerHTML=CATS.map(c=>`<a href="#${esc(c.toLowerCase())}">${esc(c)}</a>`).join("");
  $("#tk").innerHTML=POSTS.slice(0,6).map(a=>`<a href="#p-${a.id}">${esc(a.title)}</a>`).join(" &bull; ");
  document.querySelectorAll("form.srch").forEach(f=>f.onsubmit=e=>{e.preventDefault();const t=f.querySelector("input").value.trim();if(t){location.hash="q-"+encodeURIComponent(t);$("#nav").classList.remove("open")}});
}
$("#burger").onclick=()=>{const n=$("#nav").classList.toggle("open");$("#burger").setAttribute("aria-expanded",n)};
addEventListener("hashchange",()=>{page=1;$("#nav").classList.remove("open");render();scrollTo({top:0,behavior:"smooth"})});
(async()=>{
  if(db){try{const a=await db.from("settings").select("data").eq("id",1).maybeSingle();S={...DEF,...(a.data?.data||{})};
    const b=await db.from("posts").select("*").eq("published",true).order("created_at",{ascending:false});POSTS=b.data||[]}catch(e){}}
  applySettings();render();
  const sp=$("#splash");let seen=false;try{seen=S.splash=="once"&&sessionStorage.getItem("mt-seen")=="1";sessionStorage.setItem("mt-seen","1")}catch(e){}
  if(S.splash=="off"||seen){sp.remove();return}
  setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),900)},3400);
})();
</script></body></html>
